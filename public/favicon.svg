<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007aff"/>
      <stop offset="60%" stop-color="#0051d5"/>
      <stop offset="100%" stop-color="#5856d6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="32" rx="16" fill="url(#shine)"/>
  <!-- Concentric AirDrop Radiations -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.35" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-opacity="0.7" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="6" fill="#ffffff"/>
  <!-- Dynamic Transfer Beam Arrow -->
  <path d="M42 22 L51 31 L42 40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>